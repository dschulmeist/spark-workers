<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360" role="img" aria-labelledby="title desc">
  <title id="title">Spark workers architecture</title>
  <desc id="desc">Codex and Claude Code assign tasks to Spark workers, which manages shared capacity and durable task state. OpenCode edits isolated Git worktrees and calls local or remote model servers. Patches and evidence return to the coordinator for review.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#dce5e8"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#526b77" stroke-width="1.6"/>
    </marker>
    <marker id="return" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#138d84" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="1080" height="360" rx="20" fill="#f4f7f8"/>
  <rect x="1" y="1" width="1078" height="358" rx="19" fill="url(#grid)" stroke="#dce5e8"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="28" y="24" width="770" height="288" rx="16" fill="#eaf0f2" stroke="#d3dfe3"/>
    <text x="48" y="49" font-size="11" font-weight="700" letter-spacing="1.5" fill="#526b77">YOUR HOST</text>

    <g stroke="#526b77" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M236 141H284"/>
      <path d="M520 141H568"/>
      <path d="M772 141H848"/>
    </g>
    <text x="260" y="121" text-anchor="middle" font-size="11" fill="#526b77">MCP</text>
    <text x="544" y="121" text-anchor="middle" font-size="11" fill="#526b77">task</text>
    <text x="812" y="121" text-anchor="middle" font-size="11" fill="#526b77">infer</text>

    <rect x="48" y="76" width="188" height="132" rx="12" fill="#ffffff" stroke="#cedbe0"/>
    <text x="66" y="102" font-size="11" font-weight="700" letter-spacing="1.4" fill="#526b77">01 / COORDINATE</text>
    <text x="66" y="136" font-size="21" font-weight="650" fill="#172b3a">Codex</text>
    <text x="66" y="163" font-size="21" font-weight="650" fill="#172b3a">Claude Code</text>
    <text x="66" y="189" font-size="13" fill="#526b77">Scope, supervise, review</text>

    <rect x="284" y="68" width="236" height="148" rx="12" fill="#172b3a"/>
    <text x="304" y="96" font-size="11" font-weight="700" letter-spacing="1.4" fill="#62d2c3">02 / SCHEDULE</text>
    <text x="304" y="133" font-size="25" font-weight="700" fill="#ffffff">Spark workers</text>
    <text x="304" y="163" font-size="14" fill="#d0dce1">Shared capacity</text>
    <text x="304" y="187" font-size="14" fill="#d0dce1">Durable tasks + results</text>

    <rect x="568" y="76" width="204" height="132" rx="12" fill="#ffffff" stroke="#cedbe0"/>
    <text x="588" y="102" font-size="11" font-weight="700" letter-spacing="1.4" fill="#526b77">03 / EXECUTE</text>
    <text x="588" y="137" font-size="23" font-weight="650" fill="#172b3a">OpenCode</text>
    <text x="588" y="164" font-size="14" fill="#526b77">Edit files. Run tools.</text>
    <text x="588" y="188" font-size="13" fill="#526b77">One worktree per task</text>

    <rect x="848" y="76" width="192" height="132" rx="12" fill="#dcf3ef" stroke="#acdcd4"/>
    <text x="868" y="102" font-size="11" font-weight="700" letter-spacing="1.4" fill="#137d77">04 / INFER</text>
    <text x="868" y="137" font-size="23" font-weight="650" fill="#172b3a">Your models</text>
    <text x="868" y="164" font-size="14" fill="#466b70">Local or remote</text>
    <text x="868" y="188" font-size="13" fill="#466b70">Pinned for each task</text>

    <path d="M670 208V266H142V208" fill="none" stroke="#138d84" stroke-width="2" marker-end="url(#return)"/>
    <rect x="261" y="252" width="294" height="28" rx="14" fill="#eaf0f2"/>
    <text x="408" y="271" text-anchor="middle" font-size="13" font-weight="600" fill="#137d77">Patch + evidence back for review</text>
  </g>
</svg>
